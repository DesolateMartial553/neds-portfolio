<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Ned</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/neds-portfolio/assets/ned-brand-mark.png">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(/neds-portfolio/assets/fonts/bricolage-grotesque-latin.woff2) format("woff2");font-weight:300 800;font-display:swap}
:root{--ink:#17130F;--paper:#F7F0E0;--sky:#6FB4F2;--go:#C8672C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--sky);color:var(--ink);font:400 18px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
.card{background:#FFFAEC;border:2px solid var(--ink);border-radius:4px;padding:32px 28px;max-width:440px;rotate:-1.5deg}
h1{margin:0 0 12px;font-weight:800;font-size:clamp(2.4rem,6vw,5.5rem);line-height:.95;letter-spacing:-.02em}
p{margin:0 0 24px}
a{display:inline-flex;align-items:center;min-height:44px;padding:9px 22px;background:var(--go);color:var(--ink);border:2px solid var(--ink);border-radius:999px;font-weight:800;text-decoration:none}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
  <div class="card">
    <h1>Page not found</h1>
    <p>That page doesn't exist, but the rest of the site does.</p>
    <a href="/neds-portfolio/">Back to Ned's portfolio</a>
  </div>
</body>
</html>
