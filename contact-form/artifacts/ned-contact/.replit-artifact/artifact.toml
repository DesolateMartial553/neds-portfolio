kind = "web"
previewPath = "/"
title = "Ned — Get in Touch"
description = "A warm, minimal lead-capture experience for Ned, a Birmingham web designer and developer, with secure database storage and a password-protected owner dashboard for reviewing enquiries."
version = "1.0.0"
id = "artifacts/ned-contact"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25128

[services.development]
run = "pnpm --filter @workspace/ned-contact run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ned-contact", "run", "build" ]
serve = "static"
publicDir = "artifacts/ned-contact/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25128"
BASE_PATH = "/"
