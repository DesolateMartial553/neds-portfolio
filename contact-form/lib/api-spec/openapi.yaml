openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Public lead capture and private owner review
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit a project enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Enquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadReceipt"
        "400":
          description: Invalid enquiry
  /owner/login:
    post:
      operationId: ownerLogin
      tags: [leads]
      summary: Start an owner session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSession"
        "401":
          description: Incorrect password
  /owner/session:
    get:
      operationId: getOwnerSession
      tags: [leads]
      summary: Check owner session
      responses:
        "200":
          description: Current session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSession"
  /owner/logout:
    post:
      operationId: ownerLogout
      tags: [leads]
      summary: End owner session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSession"
  /owner/leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List submitted leads for the owner
      responses:
        "200":
          description: Submitted leads, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          description: Owner authentication required
  /owner/leads/{id}:
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a submitted lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lead deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDeleteResult"
        "401":
          description: Owner authentication required
        "404":
          description: Lead not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LeadInput:
      type: object
      additionalProperties: false
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        businessName:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        message:
          type: string
          minLength: 10
          maxLength: 5000
    LeadReceipt:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    Lead:
      type: object
      required: [id, name, email, message, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        businessName:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: ["string", "null"]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    OwnerLoginInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 500
    OwnerSession:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
    LeadDeleteResult:
      type: object
      required: [success, id]
      properties:
        success:
          type: boolean
        id:
          type: integer

